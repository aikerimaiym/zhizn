<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9B7BC4">
<title>Жизнь</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">Жизнь <span id="brandSub" style="font-weight:400;color:#857B93">· Сегодня</span></div>
  <button class="ghost" id="syncDot" style="font-size:13px;display:none"></button>
  <div class="month" id="monthBar">
    <button class="ghost" id="mPrev" aria-label="Предыдущий месяц">‹</button>
    <span id="mLabel"></span>
    <button class="ghost" id="mNext" aria-label="Следующий месяц">›</button>
  </div>
</header>
<div id="finNav" class="finnav" style="display:none"></div>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="today" class="on"><span>☀</span>Сегодня</button>
  <button data-tab="fin"><span>₸</span>Финансы</button>
  <button data-tab="add" class="plus" aria-label="Добавить">+</button>
  <button data-tab="plan"><span>🗓</span>План</button>
  <button data-tab="more"><span>⋯</span>Ещё</button>
</nav>
<div class="toast" id="toast"></div>
<script src="defaults.js"></script>
<script src="app.js"></script>
<script src="analytics.js"></script>
<script src="report.js"></script>
<script src="life.js"></script>
<script src="character.js"></script>
<script src="game2.js"></script>
<script src="ui.js"></script>
</body>
</html>
